name: Build Swell Reverse
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Configure universal Mac
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Sign and package macOS bundles
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          cd build/SwellVerb_artefacts/Release
          for bundle in "AU/Swell Reverse.component" "VST3/Swell Reverse.vst3" "Standalone/Swell Reverse.app"; do
            codesign --force --deep -s - "$bundle"
            codesign --verify --deep --strict "$bundle"
          done
          ditto -c -k --keepParent VST3 ../../../package/Swell-Reverse-macOS-VST3.zip
          ditto -c -k --keepParent AU ../../../package/Swell-Reverse-macOS-AU.zip
          ditto -c -k --keepParent Standalone ../../../package/Swell-Reverse-macOS-Standalone.zip
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Compress-Archive -Path 'build/SwellVerb_artefacts/Release/VST3/*.vst3', 'build/SwellVerb_artefacts/Release/Standalone/*.exe' -DestinationPath 'package/Swell-Reverse-Windows.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Swell-Reverse-${{ runner.os }}
          path: package/*.zip
          if-no-files-found: error
